<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />

    <!--
      Theme, set before first paint. Anything later than this renders one frame
      of the wrong palette, which is the flash every themed site is judged on.
      Deliberately inline and dependency-free so it cannot be delayed by a
      module fetch.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('akh.portfolio.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
